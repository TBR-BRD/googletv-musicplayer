name: Release APK

# Builds the release-signed APK for a version tag (v1.2.3) and attaches it to
# that tag's GitHub release as Radioplayer.apk (the name the README's
# "latest/download" link points at). Creates the release if it doesn't exist
# yet, otherwise just replaces the APK on it.
#
# Required repository secrets:
#   RADIOPLAYER_KEYSTORE_BASE64    base64 of the release .jks
#   RADIOPLAYER_KEYSTORE_PASSWORD  store + key password
#   RADIOPLAYER_KEY_ALIAS          key alias

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.4.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RADIOPLAYER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "RADIOPLAYER_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RADIOPLAYER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RADIOPLAYER_KEYSTORE_PASSWORD: ${{ secrets.RADIOPLAYER_KEYSTORE_PASSWORD }}
          RADIOPLAYER_KEY_ALIAS: ${{ secrets.RADIOPLAYER_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee /dev/stderr | grep -q "CN=Thoralf Brandt"
          cp app/build/outputs/apk/release/app-release.apk Radioplayer.apk

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Radioplayer.apk --clobber
          else
            gh release create "$TAG" Radioplayer.apk --title "Radioplayer $TAG" --generate-notes
          fi
